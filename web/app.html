<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus — EPC Project Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root[data-theme="dark"] {
    --bg-grad: linear-gradient(135deg, #09090b 0%, #111827 100%);
    --panel-bg: rgba(22, 27, 34, 0.4);
    --panel-border: rgba(255, 255, 255, 0.08);
    --line: rgba(255, 255, 255, 0.1);
    --ink: #f1f5f9;
    --dim: #94a3b8;
    --accent: #3b82f6;
    --accent-glow: rgba(59, 130, 246, 0.4);
    --ok: #22c55e;
    --ok-bg: rgba(34, 197, 94, 0.1);
    --warn: #eab308;
    --warn-bg: rgba(234, 179, 8, 0.1);
    --bad: #ef4444;
    --bad-bg: rgba(239, 68, 68, 0.1);
    --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
  }

  :root[data-theme="light"] {
    --bg-grad: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
    --panel-bg: rgba(255, 255, 255, 0.6);
    --panel-border: rgba(255, 255, 255, 1);
    --line: rgba(0, 0, 0, 0.1);
    --ink: #0f172a;
    --dim: #64748b;
    --accent: #2563eb;
    --accent-glow: rgba(37, 99, 235, 0.3);
    --ok: #16a34a;
    --ok-bg: rgba(22, 163, 74, 0.1);
    --warn: #d97706;
    --warn-bg: rgba(217, 119, 6, 0.1);
    --bad: #dc2626;
    --bad-bg: rgba(220, 38, 38, 0.1);
    --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.05);
  }

  * { box-sizing: border-box; }
  body { 
    margin: 0; 
    background: var(--bg-grad); 
    color: var(--ink); 
    font: 14px/1.5 'Inter', sans-serif;
    min-height: 100vh;
    transition: background 0.3s ease, color 0.3s ease;
  }
  
  .glass {
    background: var(--panel-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--panel-border);
    box-shadow: var(--shadow);
  }

  header { 
    padding: 20px 24px; 
    border-bottom: 1px solid var(--line); 
    display: flex; 
    align-items: baseline; 
    gap: 16px; 
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  
  h1 { font-size: 20px; margin: 0; font-weight: 600; letter-spacing: -0.02em; }
  h1 span { color: var(--dim); font-weight: 400; }
  .meta { color: var(--dim); font-family: 'JetBrains Mono', monospace; font-size: 12px; margin-left: auto; }
  
  #theme-toggle {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    transition: all 0.2s ease;
  }
  #theme-toggle:hover {
    background: var(--line);
  }

  nav { 
    display: flex; 
    gap: 8px; 
    padding: 16px 24px; 
    border-bottom: 1px solid var(--line); 
    overflow-x: auto; 
  }
  
  nav button { 
    background: transparent; 
    border: 1px solid transparent; 
    color: var(--dim); 
    padding: 8px 16px;
    border-radius: 999px;
    font: inherit; 
    font-weight: 500;
    cursor: pointer; 
    white-space: nowrap; 
    transition: all 0.2s ease;
  }
  
  nav button:hover { 
    color: var(--ink); 
    background: var(--line);
  }
  
  nav button[aria-selected=true] { 
    color: #fff;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent-glow);
  }
  
  main { padding: 32px 24px; max-width: 1200px; margin: 0 auto; }
  section { display: none; animation: fadeIn 0.3s ease-out; }
  section.on { display: block; }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  h2 { 
    font-size: 12px; 
    text-transform: uppercase; 
    letter-spacing: 0.1em; 
    color: var(--dim); 
    margin: 40px 0 16px; 
    font-weight: 600; 
  }
  h2:first-child { margin-top: 0; }
  
  .cards { 
    display: grid; 
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
    gap: 16px; 
  }
  
  .card { 
    border-radius: 12px; 
    padding: 20px; 
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 24px var(--shadow);
  }
  
  .card .k { color: var(--dim); font-size: 13px; font-weight: 500; }
  .card .v { font-size: 28px; font-weight: 600; font-family: 'JetBrains Mono', monospace; margin-top: 8px; }
  
  table { 
    width: 100%; 
    border-collapse: collapse; 
    border-radius: 12px; 
    overflow: hidden; 
  }
  
  th, td { 
    text-align: left; 
    padding: 12px 16px; 
    border-bottom: 1px solid var(--line); 
    vertical-align: middle; 
  }
  
  th { color: var(--dim); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  tr:last-child td { border-bottom: 0; }
  
  tbody tr { transition: background 0.15s ease; }
  tbody tr:hover { background: rgba(255, 255, 255, 0.03); }
  
  td.num { font-family: 'JetBrains Mono', monospace; white-space: nowrap; }
  
  .tag { 
    display: inline-block; 
    padding: 4px 10px; 
    border-radius: 6px; 
    font-size: 11px; 
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  
  .ok { color: var(--ok); } 
  .tag.ok { background: var(--ok-bg); }
  
  .warn { color: var(--warn); } 
  .tag.warn { background: var(--warn-bg); }
  
  .bad { color: var(--bad); } 
  .tag.bad { background: var(--bad-bg); }
  
  .dim { color: var(--dim); }
  .tag.dim { background: rgba(148, 163, 184, 0.1); }
  
  .sub { color: var(--dim); font-size: 12px; margin-top: 4px; }
  ul.sig { margin: 8px 0 0; padding-left: 20px; color: var(--dim); font-size: 12px; }
  
  pre { 
    border-radius: 12px; 
    padding: 20px; 
    overflow: auto;
    font-family: 'JetBrains Mono', monospace; 
    font-size: 13px; 
    white-space: pre-wrap; 
    color: var(--dim);
  }
  
  .bar { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; margin-top: 8px; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; box-shadow: 0 0 8px var(--accent-glow);}
</style>
</head>
<body>
<header class="glass">
  <h1 id="title">loading… <span></span></h1>
  <div class="meta" id="meta"></div>
  <button id="theme-toggle">Light Mode</button>
</header>
<nav id="tabs" class="glass"></nav>
<main id="main"></main>

<script>
const toggleBtn = document.getElementById('theme-toggle');
let currentTheme = 'dark';

toggleBtn.addEventListener('click', () => {
  currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', currentTheme);
  toggleBtn.textContent = currentTheme === 'dark' ? 'Light Mode' : 'Dark Mode';
});

const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = (s) => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
// evidence is a dict (auto: ts/value/point/note, manual: reading/photo/notes) — show the parts that matter, not [object Object]
const evidenceText = (ev) => !ev ? '' : [
  ev.value !== undefined ? `value=${ev.value}` : null,
  ev.reading !== undefined ? `reading=${ev.reading}` : null,
  ev.note || ev.notes || null,
].filter(Boolean).join(' · ');
const pct = (x) => (x * 100).toFixed(0) + '%';
const sevClass = (s) => ({high:'bad', medium:'warn', low:'dim', none:'dim'}[s] || 'dim');
const statusClass = (s) => ({compliant:'ok', passed:'ok', partial:'warn', needs_review:'warn', open:'bad',
                             deviation:'bad', missing:'bad', failed:'bad', no_data:'warn'}[s] || 'dim');
const tag = (s, cls) => `<span class="tag ${cls || statusClass(s)}">${esc(s)}</span>`;
const table = (head, rows) =>
  `<table class="glass"><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>`;

// ponytail: covers the # / ## / **bold** / '- ' / '| a | b |' subset that package_markdown() emits, not full CommonMark
const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
const renderMarkdown = (md) => {
  const lines = md.split('\n');
  const html = [];
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (/^\|/.test(line)) {
      const head = line.slice(1, -1).split('|').map(c => c.trim());
      i += 2; // skip header + '|---|' separator
      const rows = [];
      while (i < lines.length && /^\|/.test(lines[i])) {
        rows.push(`<tr>${lines[i].slice(1, -1).split('|').map(c => `<td>${inline(c.trim())}</td>`).join('')}</tr>`);
        i++;
      }
      i--;
      html.push(table(head, rows));
    } else if (/^# /.test(line)) html.push(`<h2>${inline(line.slice(2))}</h2>`);
    else if (/^## /.test(line)) html.push(`<h3>${inline(line.slice(3))}</h3>`);
    else if (/^- /.test(line)) html.push(`<div class="sub">${inline(line.slice(2))}</div>`);
    else if (line.trim()) html.push(`<div>${inline(line)}</div>`);
  }
  return html.join('');
};

const TABS = {
  'Overview': (s) => {
    const cards = [
      ['Slip forecast', s.engine2.project_slip_days + ' d', s.engine2.project_slip_days > 0 ? 'bad' : 'ok'],
      ['Activities flagged', s.engine2.flagged.length],
      ['Bids verified', s.engine1.length],
      ['Open NCRs', s.dashboards.quality.open_ncrs.length, s.dashboards.quality.open_ncrs.length ? 'bad' : 'ok'],
      ['Commissioning', `${s.dashboards.quality.commissioning.passed}/${s.dashboards.quality.commissioning.total}`],
      ['Package', s.engine3.package.ready ? 'READY' : 'NOT READY', s.engine3.package.ready ? 'ok' : 'warn'],
    ].map(([k, v, c]) => `<div class="card glass"><div class="k">${k}</div><div class="v ${c || ''}">${esc(v)}</div></div>`).join('');

    const kpi = Object.entries(s.kpis).map(([k, v]) =>
      `<tr><td>${esc(k.replace(/_/g, ' '))}</td><td class="num">${esc(v)}</td></tr>`);

    const risks = s.dashboards.pm.top_risks.map(r => `<tr>
      <td class="num">${esc(r.activity)}</td><td class="num ${r.slip > 0 ? 'bad' : ''}">${r.slip} d</td>
      <td class="num">${r.score.toFixed(2)}</td><td>${esc(r.do || '—')}</td></tr>`);

    return `<h2>Portfolio</h2><div class="cards">${cards}</div>
      <h2>Top risks (PM view)</h2>${table(['Activity', 'Slip', 'Score', 'Recommended action'], risks)}
      <h2>Leading indicators</h2>${table(['KPI', 'Value'], kpi)}`;
  },

  'Engine 1 · Verification': (s) => {
    const vendors = s.engine1.map(r => `<tr>
      <td>${esc(r.vendor)}<div class="sub">${esc(r.bid)} · ₹${(r.price || 0).toLocaleString('en-IN')} · ${r.lead_weeks}w</div></td>
      <td class="num">${pct(r.compliance_ratio)}<div class="bar"><i style="width:${r.compliance_ratio * 100}%"></i></div></td>
      <td class="num">${r.fulfilment.score.toFixed(2)}</td>
      <td class="num ${r.vendor_risk > .3 ? 'bad' : 'ok'}">${r.vendor_risk.toFixed(2)}</td>
      <td class="num">${Object.entries(r.counts).filter(([, n]) => n).map(([k, n]) => `${n} ${k}`).join(' · ')}</td></tr>`);

    const devs = s.engine1.flatMap(r => r.deviations.map(f => `<tr>
      <td class="num">${esc(r.vendor)}</td>
      <td>${tag(f.severity, sevClass(f.severity))}</td>
      <td>${tag(f.status)}</td>
      <td>${esc(f.requirement_text)}<div class="sub">${esc((f.checks || [])[0]?.note || '')}</div></td>
      <td class="num ${f.review === 'pending' ? 'dim' : 'ok'}">${esc(f.review)}</td></tr>`));

    return `<h2>Bid comparison</h2>${table(['Vendor', 'Compliance', 'Fulfilment', 'Vendor risk', 'Findings'], vendors)}
      <h2>Deviations &amp; review queue</h2>${table(['Vendor', 'Sev', 'Status', 'Requirement', 'Review'], devs)}`;
  },

  'Engine 2 · Risk': (s) => {
    const rows = s.engine2.activities.map(a => {
      const flagged = s.engine2.flagged.includes(a.activity);
      const sigs = flagged ? `<ul class="sig">${a.signals.map(x => `<li>${esc(x.source)}: ${esc(x.reason)}</li>`).join('')}</ul>` : '';
      const mits = flagged ? a.mitigations.slice(0, 2).map(m =>
        `<div>${esc(m.action)}<span class="sub"> — ${m.days_saved}d, ₹${m.cost_inr.toLocaleString('en-IN')}${m.covers_slip ? ' ✓ covers slip' : ''}</span></div>`).join('') : '—';
      return `<tr>
        <td class="num">${esc(a.activity)}</td>
        <td>${esc(a.name)}${sigs}</td>
        <td class="num ${a.slip_days > 0 ? 'bad' : 'dim'}">${a.slip_days} d</td>
        <td class="num">${a.score.toFixed(2)}</td>
        <td>${mits}</td></tr>`;
    });
    return `<h2>Forecast as of ${esc(s.engine2.as_of)}</h2>
      <div class="cards"><div class="card glass"><div class="k">Project finish slip</div>
        <div class="v ${s.engine2.project_slip_days > 0 ? 'bad' : 'ok'}">${s.engine2.project_slip_days} days</div></div></div>
      <h2>Critical path</h2>${table(['ID', 'Activity / signals', 'Slip', 'Score', 'Ranked mitigations'], rows)}`;
  },

  'Engine 3 · Commissioning': (s) => {
    const cases = s.engine3.package.cases.map(c => `<tr>
      <td>${esc(c.text)}</td><td>${tag(c.mode, c.mode === 'auto' ? 'ok' : 'dim')}</td><td>${tag(c.status)}</td>
      <td class="num sub">${esc(evidenceText((c.results || []).at(-1)?.evidence))}</td></tr>`);
    const ncrs = s.engine3.ncrs.map(n => `<tr>
      <td class="num">${esc(n.id)}</td><td>${tag(n.status)}</td><td class="num">${esc(n.vendor || '—')}</td>
      <td>${esc(n.symptom)}<div class="sub">precedent ${esc(n.recommendations[0].precedent)}: ${esc(n.recommendations[0].resolution)}</div></td></tr>`);
    const p = s.engine3.package.summary;
    const cards = [['Test cases', p.cases], ['Automated', p.auto], ['Manual', p.manual], ['Passed', p.passed],
                   ['NCRs open', p.ncr_open, p.ncr_open ? 'bad' : 'ok']]
      .map(([k, v, c]) => `<div class="card glass"><div class="k">${k}</div><div class="v ${c || ''}">${v}</div></div>`).join('');
    return `<h2>Package — ${s.engine3.package.ready ? '<span class="ok">READY</span>' : '<span class="warn">NOT READY</span>'}</h2>
      <div class="cards">${cards}</div>
      <h2>Test cases</h2>${table(['Case', 'Mode', 'Status', 'Evidence'], cases)}
      <h2>Non-conformance reports</h2>${table(['NCR', 'Status', 'Vendor', 'Symptom / recommendation'], ncrs)}
      <h2>As-commissioned markdown</h2><div class="glass">${renderMarkdown(s.engine3.markdown)}</div>`;
  },

  'Audit trail': (s) => {
    const rows = s.audit.log.map(e => `<tr>
      <td class="num">${e.seq}</td>
      <td class="num sub">${new Date(e.ts * 1000).toLocaleTimeString()}</td>
      <td class="num">${esc(e.actor)}</td><td class="num">${esc(e.action)}</td>
      <td class="sub">${esc(JSON.stringify(e.payload)).slice(0, 180)}</td></tr>`);
    return `<h2>Hash chain ${s.audit.valid ? '<span class="ok">valid</span>' : '<span class="bad">BROKEN</span>'}
      · ${s.audit.log.length} entries</h2>${table(['#', 'Time', 'Actor', 'Action', 'Payload'], rows)}`;
  },
};

fetch('/api/state').then(r => r.json()).then(state => {
  document.getElementById('title').innerHTML =
    `Nexus <span>— ${esc(state.project.name)}</span>`;
  document.getElementById('meta').textContent =
    `${state.project.id} · ${state.project.client} · as of ${state.project.today}`;

  const nav = document.getElementById('tabs'), main = document.getElementById('main');
  Object.entries(TABS).forEach(([name, render], i) => {
    const sec = $(`<section${i ? '' : ' class="on"'}></section>`);
    sec.innerHTML = render(state);
    main.append(sec);
    const btn = $(`<button aria-selected="${!i}">${name}</button>`);
    btn.onclick = () => {
      nav.querySelectorAll('button').forEach(b => b.setAttribute('aria-selected', b === btn));
      main.querySelectorAll('section').forEach(x => x.classList.toggle('on', x === sec));
    };
    nav.append(btn);
  });
}).catch(e => { document.getElementById('main').innerHTML = `<pre class="bad glass">${esc(e)}</pre>`; });
</script>
</body>
</html>

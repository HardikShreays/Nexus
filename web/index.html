<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus — EPC Project Intelligence</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --line: #262d38; --ink: #e6edf3; --dim: #8b949e;
    --accent: #58a6ff; --ok: #3fb950; --warn: #d29922; --bad: #f85149;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { padding: 20px 24px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; letter-spacing: -.01em; }
  h1 span { color: var(--dim); font-weight: 400; }
  .meta { color: var(--dim); font-family: var(--mono); font-size: 12px; margin-left: auto; }
  nav { display: flex; gap: 4px; padding: 0 16px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  nav button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--dim); padding: 12px 14px;
               font: inherit; cursor: pointer; white-space: nowrap; }
  nav button:hover { color: var(--ink); }
  nav button[aria-selected=true] { color: var(--ink); border-bottom-color: var(--accent); }
  main { padding: 24px; max-width: 1200px; }
  section { display: none; }
  section.on { display: block; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 28px 0 10px; font-weight: 600; }
  h2:first-child { margin-top: 0; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
  .card .k { color: var(--dim); font-size: 12px; }
  .card .v { font-size: 24px; font-variant-numeric: tabular-nums; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--dim); font-size: 12px; font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-family: var(--mono);
         border: 1px solid currentColor; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); } .dim { color: var(--dim); }
  .sub { color: var(--dim); font-size: 12px; }
  ul.sig { margin: 6px 0 0; padding-left: 16px; color: var(--dim); font-size: 12px; }
  pre { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; overflow: auto;
        font-family: var(--mono); font-size: 12px; white-space: pre-wrap; }
  .bar { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .bar i { display: block; height: 100%; background: var(--accent); }
</style>
</head>
<body>
<header>
  <h1 id="title">loading… <span></span></h1>
  <div class="meta" id="meta"></div>
</header>
<nav id="tabs"></nav>
<main id="main"></main>

<script>
const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = (s) => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const pct = (x) => (x * 100).toFixed(0) + '%';
const sevClass = (s) => ({high:'bad', medium:'warn', low:'dim', none:'dim'}[s] || 'dim');
const statusClass = (s) => ({compliant:'ok', passed:'ok', partial:'warn', needs_review:'warn', open:'bad',
                             deviation:'bad', missing:'bad'}[s] || 'dim');
const tag = (s, cls) => `<span class="tag ${cls || statusClass(s)}">${esc(s)}</span>`;
const table = (head, rows) =>
  `<table><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>`;

const TABS = {
  'Overview': (s) => {
    const cards = [
      ['Slip forecast', s.engine2.project_slip_days + ' d', s.engine2.project_slip_days > 0 ? 'bad' : 'ok'],
      ['Activities flagged', s.engine2.flagged.length],
      ['Bids verified', s.engine1.length],
      ['Open NCRs', s.dashboards.quality.open_ncrs.length, s.dashboards.quality.open_ncrs.length ? 'bad' : 'ok'],
      ['Commissioning', `${s.dashboards.quality.commissioning.passed}/${s.dashboards.quality.commissioning.total}`],
      ['Package', s.engine3.package.ready ? 'READY' : 'NOT READY', s.engine3.package.ready ? 'ok' : 'warn'],
    ].map(([k, v, c]) => `<div class="card"><div class="k">${k}</div><div class="v ${c || ''}">${esc(v)}</div></div>`).join('');

    const kpi = Object.entries(s.kpis).map(([k, v]) =>
      `<tr><td>${esc(k.replace(/_/g, ' '))}</td><td class="num">${esc(v)}</td></tr>`);

    const risks = s.dashboards.pm.top_risks.map(r => `<tr>
      <td class="num">${esc(r.activity)}</td><td class="num ${r.slip > 0 ? 'bad' : ''}">${r.slip} d</td>
      <td class="num">${r.score.toFixed(2)}</td><td>${esc(r.do || '—')}</td></tr>`);

    return `<h2>Portfolio</h2><div class="cards">${cards}</div>
      <h2>Top risks (PM view)</h2>${table(['Activity', 'Slip', 'Score', 'Recommended action'], risks)}
      <h2>Leading indicators</h2>${table(['KPI', 'Value'], kpi)}`;
  },

  'Engine 1 · Verification': (s) => {
    const vendors = s.engine1.map(r => `<tr>
      <td>${esc(r.vendor)}<div class="sub">${esc(r.bid)} · ₹${(r.price || 0).toLocaleString('en-IN')} · ${r.lead_weeks}w</div></td>
      <td class="num">${pct(r.compliance_ratio)}<div class="bar"><i style="width:${r.compliance_ratio * 100}%"></i></div></td>
      <td class="num">${r.fulfilment.score.toFixed(2)}</td>
      <td class="num ${r.vendor_risk > .3 ? 'bad' : 'ok'}">${r.vendor_risk.toFixed(2)}</td>
      <td class="num">${Object.entries(r.counts).filter(([, n]) => n).map(([k, n]) => `${n} ${k}`).join(' · ')}</td></tr>`);

    const devs = s.engine1.flatMap(r => r.deviations.map(f => `<tr>
      <td class="num">${esc(r.vendor)}</td>
      <td>${tag(f.severity, sevClass(f.severity))}</td>
      <td>${tag(f.status)}</td>
      <td>${esc(f.requirement_text)}<div class="sub">${esc((f.checks || [])[0]?.note || '')}</div></td>
      <td class="num ${f.review === 'pending' ? 'dim' : 'ok'}">${esc(f.review)}</td></tr>`));

    return `<h2>Bid comparison</h2>${table(['Vendor', 'Compliance', 'Fulfilment', 'Vendor risk', 'Findings'], vendors)}
      <h2>Deviations &amp; review queue</h2>${table(['Vendor', 'Sev', 'Status', 'Requirement', 'Review'], devs)}`;
  },

  'Engine 2 · Risk': (s) => {
    const rows = s.engine2.activities.map(a => {
      const flagged = s.engine2.flagged.includes(a.activity);
      const sigs = flagged ? `<ul class="sig">${a.signals.map(x => `<li>${esc(x.source)}: ${esc(x.reason)}</li>`).join('')}</ul>` : '';
      const mits = flagged ? a.mitigations.slice(0, 2).map(m =>
        `<div>${esc(m.action)}<span class="sub"> — ${m.days_saved}d, ₹${m.cost_inr.toLocaleString('en-IN')}${m.covers_slip ? ' ✓ covers slip' : ''}</span></div>`).join('') : '—';
      return `<tr>
        <td class="num">${esc(a.activity)}</td>
        <td>${esc(a.name)}${sigs}</td>
        <td class="num ${a.slip_days > 0 ? 'bad' : 'dim'}">${a.slip_days} d</td>
        <td class="num">${a.score.toFixed(2)}</td>
        <td>${mits}</td></tr>`;
    });
    return `<h2>Forecast as of ${esc(s.engine2.as_of)}</h2>
      <div class="cards"><div class="card"><div class="k">Project finish slip</div>
        <div class="v ${s.engine2.project_slip_days > 0 ? 'bad' : 'ok'}">${s.engine2.project_slip_days} days</div></div></div>
      <h2>Critical path</h2>${table(['ID', 'Activity / signals', 'Slip', 'Score', 'Ranked mitigations'], rows)}`;
  },

  'Engine 3 · Commissioning': (s) => {
    const cases = s.engine3.package.cases.map(c => `<tr>
      <td>${esc(c.text)}</td><td>${tag(c.mode, c.mode === 'auto' ? 'ok' : 'dim')}</td><td>${tag(c.status)}</td>
      <td class="num sub">${esc((c.results || []).at(-1)?.evidence || '')}</td></tr>`);
    const ncrs = s.engine3.ncrs.map(n => `<tr>
      <td class="num">${esc(n.id)}</td><td>${tag(n.status)}</td><td class="num">${esc(n.vendor || '—')}</td>
      <td>${esc(n.symptom)}<div class="sub">precedent ${esc(n.recommendations[0].precedent)}: ${esc(n.recommendations[0].resolution)}</div></td></tr>`);
    const p = s.engine3.package.summary;
    const cards = [['Test cases', p.cases], ['Automated', p.auto], ['Manual', p.manual], ['Passed', p.passed],
                   ['NCRs open', p.ncr_open, p.ncr_open ? 'bad' : 'ok']]
      .map(([k, v, c]) => `<div class="card"><div class="k">${k}</div><div class="v ${c || ''}">${v}</div></div>`).join('');
    return `<h2>Package — ${s.engine3.package.ready ? '<span class="ok">READY</span>' : '<span class="warn">NOT READY</span>'}</h2>
      <div class="cards">${cards}</div>
      <h2>Test cases</h2>${table(['Case', 'Mode', 'Status', 'Evidence'], cases)}
      <h2>Non-conformance reports</h2>${table(['NCR', 'Status', 'Vendor', 'Symptom / recommendation'], ncrs)}
      <h2>As-commissioned markdown</h2><pre>${esc(s.engine3.markdown)}</pre>`;
  },

  'Audit trail': (s) => {
    const rows = s.audit.log.map(e => `<tr>
      <td class="num">${e.seq}</td>
      <td class="num sub">${new Date(e.ts * 1000).toLocaleTimeString()}</td>
      <td class="num">${esc(e.actor)}</td><td class="num">${esc(e.action)}</td>
      <td class="sub">${esc(JSON.stringify(e.payload)).slice(0, 180)}</td></tr>`);
    return `<h2>Hash chain ${s.audit.valid ? '<span class="ok">valid</span>' : '<span class="bad">BROKEN</span>'}
      · ${s.audit.log.length} entries</h2>${table(['#', 'Time', 'Actor', 'Action', 'Payload'], rows)}`;
  },
};

fetch('/api/state').then(r => r.json()).then(state => {
  document.getElementById('title').innerHTML =
    `Nexus <span>— ${esc(state.project.name)}</span>`;
  document.getElementById('meta').textContent =
    `${state.project.id} · ${state.project.client} · as of ${state.project.today}`;

  const nav = document.getElementById('tabs'), main = document.getElementById('main');
  Object.entries(TABS).forEach(([name, render], i) => {
    const sec = $(`<section${i ? '' : ' class="on"'}></section>`);
    sec.innerHTML = render(state);
    main.append(sec);
    const btn = $(`<button aria-selected="${!i}">${name}</button>`);
    btn.onclick = () => {
      nav.querySelectorAll('button').forEach(b => b.setAttribute('aria-selected', b === btn));
      main.querySelectorAll('section').forEach(x => x.classList.toggle('on', x === sec));
    };
    nav.append(btn);
  });
}).catch(e => { document.getElementById('main').innerHTML = `<pre class="bad">${esc(e)}</pre>`; });
</script>
</body>
</html>
